services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: azurecertify-backend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/azurecertify
      - JWT_SECRET=azurecertify-super-secret-key-12345
      - KANIDM_TLS_SKIP_VERIFY=${KANIDM_TLS_SKIP_VERIFY:-false}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_started
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_BANNER_ENABLED=${VITE_BANNER_ENABLED:-false}
        - VITE_BANNER_MESSAGE=${VITE_BANNER_MESSAGE:-}
        - VITE_BANNER_VARIANT=${VITE_BANNER_VARIANT:-info}
    container_name: azurecertify-frontend
    ports:
      - "4000:80"
    depends_on:
      - backend
  db:
    image: postgres:15
    container_name: azurecertify-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: azurecertify
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
